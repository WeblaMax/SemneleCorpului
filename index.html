<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semnalul Corpului – Suplimente și produse naturale</title>
    <meta name="description" content="Semnalul Corpului: suplimente alimentare și produse naturale, grupate pe sistemele corpului. Ascultă semnalele corpului tău." />
    <meta name="theme-color" content="#E3F3F4" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:title" content="Semnalul Corpului – Ascultă semnalele corpului tău" />
    <meta property="og:description" content="Suplimente alimentare și produse naturale, pe sistemele corpului." />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Activează JavaScript pentru a vedea site-ul.</noscript>
    <script>
      // Dacă aplicația nu pornește, arată eroarea în loc de pagină albă.
      (function () {
        function show(msg) {
          setTimeout(function () {
            var r = document.getElementById('root')
            if (r && r.children.length === 0) {
              r.innerHTML = '<div style="font-family:sans-serif;padding:24px;max-width:480px;margin:auto;color:#0B3B4A"><h1 style="font-size:22px">Site-ul nu a putut porni</h1><p>Reîncarcă pagina. Detalii pentru suport:</p><pre style="white-space:pre-wrap;font-size:12px;background:#fff8;padding:10px;border-radius:12px">' + String(msg).replace(/</g, '&lt;') + '</pre></div>'
            }
          }, 2500)
        }
        window.addEventListener('error', function (e) { show((e.message || 'eroare') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')) })
        window.addEventListener('unhandledrejection', function (e) { show(e.reason) })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
